[build]
# Lint, type-check (inside build) and the Node tests gate every deploy; migrations run only after they pass.
command = "npm run lint && npx vitest run --project node && npm run build && npx drizzle-kit migrate"
publish = "dist"
functions = "api"

[dev]
framework = "#auto"
port = 8888
autoLaunch = false
https = { keyFile = ".netlify/localhost-key.pem", certFile = ".netlify/localhost-cert.pem" }

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat" #everything matched by *
status = 200 #rewrite